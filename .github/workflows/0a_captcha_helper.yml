name: 0A. CAPTCHA Helper

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  captcha-helper:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Pull Latest Changes (Maintain Persistence)
      run: |
        git pull origin ${GITHUB_REF_NAME} --rebase

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    - name: Setup TigerVNC
      run: |
        sudo apt-get update
        sudo apt-get install -y tigervnc-standalone-server tigervnc-common x11-xserver-utils x11-utils fluxbox
        vncserver :99 -geometry 1920x1080 -depth 24 -SecurityTypes None -localhost no --I-KNOW-THIS-IS-INSECURE
        export DISPLAY=:99
        sleep 3
        xdpyinfo -display :99

    - name: Run CAPTCHA Helper Script
      env:
        DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
        DISPLAY: :99
      run: |
        python captcha_helper.py

    - name: Upload Error Screenshot
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: captcha-helper-error-screenshot
        path: error/error_screenshot.png
        if-no-files-found: ignore
        retention-days: 3